---

- name: Import networkd tasks
  ansible.builtin.import_tasks: networkd.yml
  tags:
    - network_networkd

- name: Import resolved tasks
  ansible.builtin.import_tasks: resolved.yml
  tags:
    - network_resolved
  when: "not 'tst.okfn.de' in inventory_hostname"

- name: Import hostnames tasks
  ansible.builtin.import_tasks: hostnames.yml
  tags:
    - network_resolved
  when: "not 'tst.okfn.de' in inventory_hostname"
