- name: Add node key
  ansible.builtin.apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  retries: 3
  delay: 10
  become: true
  become_user: root

- name: Remove old node versions from the sources list
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_22.x nodistro main"
    update_cache: "{{ update_apt_cache }}"
    state: absent
  become: true
  become_user: root

- name: Add node to the sources list
  ansible.builtin.apt_repository:
    repo: "deb https://deb.nodesource.com/node_26.x nodistro main"
    update_cache: "{{ update_apt_cache }}"
    state: present
  become: true
  become_user: root

- name: Install node
  ansible.builtin.apt:
    name:
      - nodejs
    update_cache: "{{ update_apt_cache }}"
    state: latest
  tags: packages
  retries: 3
  delay: 10
  become: true
  become_user: root

# TODO: remove once corepack is disabled globally
- name: Disable corepack
  ansible.builtin.command: corepack disable
  become: true
  become_user: root
  changed_when: false
  ignore_errors: true

- name: Install pnpm
  community.general.npm:
    name: pnpm
    global: true
    state: latest
  become: true
  become_user: root

