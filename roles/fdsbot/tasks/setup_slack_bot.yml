---

- name: Setup Node.js
  ansible.builtin.import_role:
    name: nodejs

- name: Setup ansible Git repo
  ansible.builtin.git:
    repo: "{{ fdsbot_ansible_git_repo }}"
    dest: "{{ fdsbot_ansible_dir }}"
    force: true
  become_user: "{{ fdsbot_user }}"
  become: true
  diff: false

- name: Get Vault Key
  ansible.builtin.copy:
    src: "../../../vault.key"
    dest: "{{ fdsbot_ansible_dir }}/vault.key"
    mode: "0640"
  become_user: "{{ fdsbot_user }}"
  become: true

- name: Setup SSH config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ fdsbot_user }}/.ssh/config"
    owner: "{{ fdsbot_user }}"
    mode: "0644"

- name: Install build dependencies
  ansible.builtin.apt:
    pkg:
      - build-essential
      - python3-dev
      - python3-pip
      - libffi-dev

- name: Install uv
  ansible.builtin.pip:
    name: uv
  become: true
  become_user: "{{ fdsbot_user }}"
  tags:
    - packages
    - skip_ansible_lint
  failed_when: false

- name: Create the virtualenv
  ansible.builtin.command:
    cmd: "python3 -m venv {{ fdsbot_ansible_env }}"
    creates: "{{ fdsbot_ansible_env }}/bin/activate"
  become_user: "{{ fdsbot_user }}"
  become: true
  changed_when: false

- name: Install ansible dependencies
  ansible.builtin.command:
    cmd: "/home/fdsbot/.local/bin/uv pip sync requirements.txt"
    chdir: "{{ fdsbot_ansible_dir }}"
  environment:
    VIRTUAL_ENV: "{{ fdsbot_ansible_env }}"
  become: true
  become_user: "{{ fdsbot_user }}"
  changed_when: false

- name: Setup fdsbot Git repo
  ansible.builtin.git:
    repo: "{{ fdsbot_git_repo }}"
    dest: "{{ fdsbot_dir }}"
    update: true
    force: true
  become_user: "{{ fdsbot_user }}"
  become: true
  notify:
    - restart fdsbot

- name: Install fdsbot dependencies
  ansible.builtin.command: pnpm install
  args:
    chdir: "{{ fdsbot_dir }}"
  become_user: "{{ fdsbot_user }}"
  become: true
  changed_when: false

- name: Build fdsbot
  ansible.builtin.command: pnpm run build
  args:
    chdir: "{{ fdsbot_dir }}"
  become_user: "{{ fdsbot_user }}"
  become: true
  changed_when: false

- name: Set fdsbot systemd service
  ansible.builtin.template:
    src: fdsbot.service.j2
    dest: /etc/systemd/system/fdsbot.service
    mode: "0444"
  notify: restart fdsbot

- name: Start fdsbot service
  ansible.builtin.systemd:
    name: fdsbot
    state: started
    daemon_reload: true
