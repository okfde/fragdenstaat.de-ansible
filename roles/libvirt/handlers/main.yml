---

- name: Restart libvirtd
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted

- name: Restart prometheus-libvirt-exporter
  ansible.builtin.systemd:
    name: prometheus-libvirt-exporter
    state: restarted

- name: Reload daemon
  ansible.builtin.systemd:
    daemon_reload: true

