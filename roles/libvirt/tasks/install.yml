---

- name: Install VM toolchain
  ansible.builtin.apt:
    name: "{{ libvirt_packages }}"

- name: Ensure libvirtd is enabled and running
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true

- name: Add users to libvirt group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: libvirt-qemu
    append: true
  loop: "{{ libvirt_users }}"

# Assumes logical volume pool in vg0 exists
- name: Create zpool
  community.general.zpool:
    name: "{{ libvirt_zpool }}"
    filesystem_properties:
      compression: lz4
      recordsize: 128k
    vdevs:
      - disks:
          - /dev/mapper/vg0-pool

- name: Create zfs filesystem for image storage
  community.general.zfs:
    name: "{{ libvirt_zpool }}/images"
    state: present
    extra_zfs_properties:
      mountpoint: "{{ libvirt_image_dir }}"

- name: Set permissions for image storage
  ansible.builtin.file:
    path: "{{ libvirt_image_dir }}"
    mode: "0755"
    owner: root
    group: root

