---

- name: Ensure ubuntu image exists
  ansible.builtin.include_tasks: _fetch_image.yml
  when: not guest.name in _all_vms.list_vms

- name: Ensure that root disk is defined
  ansible.builtin.fail:
    msg: "Disk 'root' cannot be undefined for {{ guest.name }}.\nAborting."
  when: guest.disks | selectattr('name','equalto','root') | list | length == 0

- name: Ensure that disks are configured
  ansible.builtin.include_tasks: _create_disk.yml
  loop: "{{ guest.disks }}"
  loop_control:
    loop_var: disk

# TODO: copy cloud init file
- name: Create vm
  ansible.builtin.command: >
    virt-install
    --name {{ guest.name }}
    --memory {{ guest.memory | default(2048) }}
    --vcpus {{ guest.cpus | default(2) }}
    --osinfo detect=on,require=off
    --import
    --disk path={{ libvirt_volumes_mountdir }}/{{ guest.name }}/root
    {% for disk in guest.disks %}
    {% if disk.name != 'root' %}
    --disk path={{ libvirt_volumes_mountdir }}/{{ guest.name }}/{{ disk.name }}
    {% endif %}
    {% endfor %}
    --network network=default
    --graphics none
    --noautoconsole
  register: virt_install
  changed_when: virt_install.stdout != ""
  when: not guest.name in _all_vms.list_vms

- name: Ensure vm is running
  community.libvirt.virt:
    name: "{{ guest.name }}"
    state: running
    autostart: true
