---

- name: Ensure ubuntu image exists
  ansible.builtin.import_tasks: _fetch_image.yml

- name: Get list of guests defined remote host
  community.libvirt.virt:
    command: list_vms
  register: _all_vms

- name: Destroy guest and disks
  ansible.builtin.include_tasks: _destroy.yml
  loop: "{{ libvirt_guests_delete }}"
  loop_control:
    loop_var: guest_name
    label: "{{ guest_name }}"

- name: Provision disks
  ansible.builtin.include_tasks: _create_disks.yml
  loop: "{{ libvirt_guests }}"
  loop_control:
    loop_var: guest
    label: "{{ guest.name }}"

- name: Provision guests
  ansible.builtin.include_tasks: _create_guest.yml
  loop: "{{ libvirt_guests }}"
  loop_control:
    loop_var: guest
    label: "{{ guest.name }}"
  when: not guest.name in _all_vms.list_vms or guest.name in libvirt_guests_delete

- name: Ensure guest is running and autostarted
  community.libvirt.virt:
    name: "{{ guest.name }}"
    state: "{{ guest.state | default('running') }}"
    autostart: "{{ guest.autostart | default(true) }}"
  loop: "{{ libvirt_guests }}"
  loop_control:
    loop_var: guest
    label: "{{ guest.name }}"

- name: Get list of zvolumes
  ansible.builtin.command:
    cmd: ls /srv/zpool/volumes
  register: _all_volumes
  changed_when: false

- name: Get list of residual guests and volumes
  ansible.builtin.set_fact:
    _libvirt_residual_vms: >
      {{ _all_vms.list_vms
      | ansible.builtin.difference(libvirt_guests | map(attribute='name') | list)
      | ansible.builtin.difference(libvirt_guests_delete) }}
    _libvirt_residual_volumes: >
      {{ _all_volumes.stdout | default('') | split
      | ansible.builtin.difference(libvirt_guests | map(attribute='name') | list) }}

- name: Assert there are no residual guests
  ansible.builtin.assert:
    that: _libvirt_residual_vms | length == 0
    quiet: true
    fail_msg: |
      Guests present on remote host but not defined in host_vars:
      {% for guest in _libvirt_residual_vms %}
        - {{ guest }}
      {% endfor %}

      Re-run playbook with `-e libvirt_guests_delete=['<guest-do-delete>']` to purge residual guests.
  ignore_errors: true

- name: Assert there are no residual volumes
  ansible.builtin.assert:
    that: _libvirt_residual_volumes | length == 0
    quiet: true
    fail_msg: |
      Datasets for guest volumes present on remote host but not defined in host_vars:
      {% for guest in _libvirt_residual_volumes %}
        - {{ guest }}
      {% endfor %}

      Re-run playbook with `-e libvirt_guests_delete=['<guest-do-delete>']` to purge residual disks.
  ignore_errors: true
