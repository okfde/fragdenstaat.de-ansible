---
- name: Set testsystem indicator in .bashrc (skel)
  ansible.builtin.replace:
    path: "/etc/skel/.bashrc"
    regexp: "PS1='\\${"
    replace: "PS1='TESTSYSTEM: ${"
  when: "'tst.okfn.de' in inventory_hostname and not ansible_check_mode"

- name: Set livesystem indicator in .bashrc (skel)
  ansible.builtin.replace:
    path: "/etc/skel/.bashrc"
    regexp: "PS1='\\${"
    replace: "PS1='LIVESYSTEM: ${"
  when: "not 'tst.okfn.de' in inventory_hostname and not ansible_check_mode"

- name: Allow passwordless sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%sudo   ALL='
    line: '%sudo   ALL=(ALL) NOPASSWD: ALL'
    validate: '/usr/sbin/visudo -cf %s'

- name: Add user with a bash shell and group
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    groups: sudo
    append: true
  with_items: "{{ base_ssh_users }}"

- name: Set authorized keys for users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.public_keys | default([]) | join ('\n') }}"
    exclusive: true
  loop: "{{ base_ssh_users }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set testsystem indicator in .bashrc
  ansible.builtin.replace:
    path: "/home/{{ item.name }}/.bashrc"
    regexp: "PS1='\\${"
    replace: "PS1='TESTSYSTEM: ${"
  when: "'tst.okfn.de' in inventory_hostname"
  with_items: "{{ base_ssh_users }}"

- name: Set livesystem indicator in .bashrc
  ansible.builtin.replace:
    path: "/home/{{ item.name }}/.bashrc"
    regexp: "PS1='\\${"
    replace: "PS1='LIVESYSTEM: ${"
  when: "not 'tst.okfn.de' in inventory_hostname and not ansible_check_mode"
  with_items: "{{ base_ssh_users }}"

- name: Set testsystem indicator in .bashrc (root)
  ansible.builtin.replace:
    path: "/root/.bashrc"
    regexp: "PS1='\\${"
    replace: "PS1='TESTSYSTEM: ${"
  when: "'tst.okfn.de' in inventory_hostname"

- name: Set livesystem indicator in .bashrc (root)
  ansible.builtin.replace:
    path: "/root/.bashrc"
    regexp: "PS1='\\${"
    replace: "PS1='LIVESYSTEM: ${"
  when: "not 'tst.okfn.de' in inventory_hostname and not ansible_check_mode"
