---

- name: Stop service
  ansible.builtin.systemd_service:
    name: roundcube
    state: stopped
    enabled: false

- name: Delete roundcube systemd service
  ansible.builtin.file:
    path: /etc/systemd/system/roundcube.service
    state: absent

- name: Reload daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Delete the Nginx site configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/nginx/sites-available/roundcube"
    - "/etc/nginx/sites-enabled/roundcube"
  notify: reload nginx


- name: Delete roundcube instance
  ansible.builtin.file:
    path: "{{ roundcube_dir }}"
    state: absent
