---
- name: export repokey
  ansible.builtin.command:
    cmd: "borgmatic key export"
  changed_when: false
  register: _key_export

- name: Set facts
  ansible.builtin.set_fact:
    _remote_repokey: "{{ _key_export.stdout }}"
    _repokey_has_changed: "{{ secret_borgmatic_repokey | default('') != _key_export.stdout }}"
    _vault_pass: "{{ playbook_dir }}/../vault.key"
    _host_vars_dir: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}"

- name: Do nothing if local repo key is defined and matches with repokey gathered from host
  ansible.builtin.debug:
    msg: |
      INFO: Repokey for {{ inventory_hostname }} is already present in {{ _secrets_path }}.
      INFO: Nothing to do.
  when:
    - secret_borgmatic_repokey is defined
    - _repokey_has_changed is false

- name: Warn if local repo key differs from repokey gathered from host
  ansible.builtin.debug:
    msg: |
      WARNING: Repokey stored in local secrets file differs from repokey exported on host.
      WARNING: Will overwrite stored repokey.

      Output of 'borgmatic key export' on {{ inventory_hostname }}:
      {{ _remote_repokey }}

      Value of 'borgmatic_repokey':
      {{ borgmatic_repokey }}
  when:
    - secret_borgmatic_repokey is defined
    - _repokey_has_changed is true

- name: Write secrets to disk if either of repokey or passphrase is undefined or has changed
  when:
    _repokey_is_defined is false or _repokey_has_changed or _borgmatic_passphrase_generated is defined
  block:
    - name: Set location for secrets.yml
      ansible.builtin.set_fact:
        _secrets_path: "{{ _host_vars_dir | ansible.builtin.normpath }}/secrets.yml"

    - name: Copy secrets.yml contents if exists
      block:
        - name: Check if secrets.yml exists for host
          ansible.builtin.stat:
            path: "{{ _secrets_path }}"
          register: _secrets_file_stat
          delegate_to: localhost
          become: false

        - name: Gather contents of secret.yml
          ansible.builtin.set_fact:
            _secrets_content: "{{ lookup('ansible.builtin.unvault', _secrets_path) | string | from_yaml }}"
          delegate_to: localhost
          become: false
          when:
            - _secrets_file_stat is defined
            - _secrets_file_stat.stat.exists is true
          changed_when: false

    - name: Add repo key to secret contents
      ansible.builtin.set_fact:
        _secrets_content: "{{ _secrets_content | default({}) | ansible.builtin.combine({'secret_borgmatic_repokey': _remote_repokey}) }}"
      when:
        - _repokey_has_changed is true

    - name: Insert generated borgmatic passphrase into secrets
      ansible.builtin.set_fact:
        _secrets_content: "{{ _secrets_content | default({}) | ansible.builtin.combine({'secret_borgmatic_passphrase': _borgmatic_passphrase_generated}) }}"
      when: _borgmatic_passphrase_generated is defined

    - name: Save secrets to disk
      block:
        - name: Ensure host_vars directory exists # noqa risky-file-permissions (breaks molecule)
          ansible.builtin.file:
            path: "{{ _host_vars_dir | ansible.builtin.normpath }}"
            state: directory
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Gather vault password
          when:
            - _vault_password is undefined
          block:
            - name: Stat vault file
              ansible.builtin.stat:
                path: "{{ _vault_pass }}"
              register: _vault_pass_stat
              delegate_to: localhost
              become: false

            - name: Lookup vault password
              ansible.builtin.set_fact:
                _vault_password: "{{ lookup('file', _vault_pass) }}"
              delegate_to: localhost
              become: false
              when:
                - _vault_pass_stat.stat.executable is false

            - name: Run vault pass script
              ansible.builtin.command:
                command: "bash {{ _vault_pass }}"
              register: _vault_pass_script
              delegate_to: localhost
              become: false
              changed_when: false
              when:
                - _vault_pass_stat.stat.executable is true

            - name: Set vault password
              ansible.builtin.set_fact:
                _vault_password: _vault_pass_script.stdout

        - name: Create new secrets.yml # noqa risky-file-permissions (breaks molecule)
          ansible.builtin.copy:
            content: "{{ _secrets_content | ansible.builtin.to_nice_yaml(indent=2, line_break='\"') | ansible.builtin.vault(_vault_password) }}"
            dest: "{{ _secrets_path }}"
            decrypt: false # Do not decrypt vault content when evaluating jinja expression
          delegate_to: localhost
          become: false
          diff: true

        - name: Ensure main.yml is referencing secrets in secrets.yml # noqa risky-file-permissions (breaks molecule)
          ansible.builtin.lineinfile:
            path: "{{ _host_vars_dir | ansible.builtin.normpath }}/main.yml"
            regexp: '^{{ item }}:.*'
            line: "{{ item }}: \"{% raw %}{{{% endraw %} secret_{{ item }} {% raw %}}}\"{% endraw %}"
            create: true
          delegate_to: localhost
          become: false
          diff: true
          loop:
            - "borgmatic_passphrase"
            - "borgmatic_repokey"

        - name: Inform user
          ansible.builtin.debug:
            msg: |
              Saved borgmatic secrets for {{ inventory_hostname }} to disk.

              Please check if the information stored in "{{ _secrets_path }}" is correct.
              And don't forget to commit your changes.
