---
- name: Ensure borgmatic is installed
  ansible.builtin.apt:
    pkg: "{{ borgmatic_packages }}"
    state: present

- name: Generate encryption passphrase if not defined for host
  ansible.builtin.set_fact:
    _borgmatic_passphrase_generated: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}"
  when:
    - borgmatic_passphrase is not defined

- name: Store repository passphrase # noqa risky-shell-pipe (printf will not fail)
  ansible.builtin.shell:
    cmd: "printf '%s' {{ borgmatic_passphrase | default(_borgmatic_passphrase_generated) }} | systemd-creds encrypt - /etc/credstore.encrypted/borgmatic.pw"
  register: _systemd_credential
  changed_when:
    - _systemd_credential.rc == 0

- name: Ensure /etc/borgmatic drectory exists
  ansible.builtin.file:
    path: /etc/borgmatic
    state: directory
    mode: "700"
    owner: root

- name: Add Borgmatic configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/etc/borgmatic/config.yaml"
    owner: root
    group: root
    mode: "0600"
    validate: borgmatic config validate --config %s

- name: Enable borgmatic timer
  ansible.builtin.systemd:
    name: borgmatic.timer
    enabled: true
    state: started

- name: Set repo-create command
  ansible.builtin.set_fact:
    repo_create_cmd: "{{ 'repo-create' if ansible_facts['distribution_version'] is version('26.04', '>=') else 'init' }}"

- name: Create repositories
  ansible.builtin.command:
    cmd: "borgmatic {{ repo_create_cmd }} --encryption repokey"
  register: _repo_create
  changed_when:
    - _repo_create.stderr | regex_search('.*Repository .* does not exist.*', multiline=True)
    - _repo_create.rc == 0
