gunicorn_user_uid: "1111"
gunicorn_num_workers: 1
uvicorn_num_workers: 1
gunicorn_cmssite_num_workers: 1
celery_workers:
  - name: celery
    queues: "celery"
    worker: 1
  - name: mail
    queues: "emailfetch,email"
    worker: 1
  - name: mailsend
    queues: "emailsend"
    worker: 1
  - name: mailsend_bulk
    queues: "emailsend_bulk"
    worker: 1
  - name: search
    queues: "searchindex"
    worker: 1
  - name: celery_solo_1
    queues: "redact,ocr,convert,convert_office,document"
    worker: 1
    type: slow


certbot_mode: "dns-01"
certbot_script: /opt/certbot/bin/certbot

nginx_web_redirect_domains:
  - from: "blog.test.zerschlagdenstaat.de"
    domain: "test.zerschlagdenstaat.de/blog"
    https: true
  - from: "shop.test.zerschlagdenstaat.de"
    domain: "test.zerschlagdenstaat.de/shop"
    https: true
  - from: "app.test.zerschlagdenstaat.de"
    domain: "test.zerschlagdenstaat.de/app"
    https: true
  - from: "mail.test.zerschlagdenstaat.de"
    domain: "test.zerschlagdenstaat.de"
    https: true

nginx_extra_domains:
  - domain: mta-sts.test.zerschlagdenstaat.de
    files:
      - path: "/.well-known/mta-sts.txt"
        filename: mta-sts.txt

nginx_set_real_ip_from: "192.168.122.0/24"
