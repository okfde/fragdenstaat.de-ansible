---

- name: Base
  hosts: all
  become: true
  become_user: root

  roles:
    - role: base
      tags: base
    - role: wireguard
      tags: wireguard
    - role: monitor
      tags: monitor
    - role: storage
      tags: storage
      when: inventory_hostname in groups["media"]
    - role: postfix_light
      tags: mail_light
      when: inventory_hostname in groups["mail_light"]
    - role: msmtp
      tags: msmtp
      when: inventory_hostname in groups["msmtp"]
    - role: fonts
      tags: fonts
    - role: scripts
      tags: scripts
    - role: updates
      tags: updates
